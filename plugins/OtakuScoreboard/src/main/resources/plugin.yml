name: OtakuScoreboard
version: ${project.version}
main: de.otaku.scoreboard.OtakuScoreboardPlugin
description: Configurable Paper scoreboard plugin.
author: ExamplePlayer
api-version: '1.21.11'
softdepend:
  - PlaceholderAPI
  - LuckPerms
  - ItemsAdder
  - Vault
  - TAB
commands:
  otakuscoreboard:
    description: Manage the Otaku scoreboard.
    usage: /otakuscoreboard <reload|toggle>
    aliases:
      - oscoreboard
      - otsb
  rainbow:
    description: Toggle animated rainbow tablist names for everyone.
    usage: /rainbow
permissions:
  otakuscoreboard.admin:
    description: Allows reloading the scoreboard config.
    default: op
  otakuscoreboard.toggle:
    description: Allows toggling the scoreboard for yourself.
    default: true
  otakuscoreboard.rainbow:
    description: Allows toggling rainbow tablist mode.
    default: op
