commands:
  usage:
    status: "<gray>Nutze <white>/novaguard status Spieler</white>.</gray>"
    packetinfo: "<gray>Nutze <white>/novaguard packetinfo Spieler</white>.</gray>"
    uuid-list: "<gray>Nutze <white>/novaguard %list% add|remove|list|check</white>.</gray>"
    uuid-target: "<gray>Nutze <white>/novaguard %list% %action% Spieler|UUID</white>.</gray>"
    ipblacklist: "<gray>Nutze <white>/novaguard ipblacklist add|remove|list|check</white>.</gray>"
