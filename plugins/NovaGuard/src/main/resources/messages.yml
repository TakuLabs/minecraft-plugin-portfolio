      packetinfo: "<gray>Zeigt Live-Daten zur Packet-Protection eines Online-Spielers.</gray>"
      iplimit: "<gray>Prüft, setzt oder entfernt individuelle Accounts-pro-IP-Limits.</gray>"
      ipblacklist: "<gray>Verwaltet blockierte IP-Adressen oder gespeicherte IP-Identifier.</gray>"
      whitelist: "<gray>Verwaltet Spieler, die vom IP-Limit ausgenommen sind.</gray>"
      blacklist: "<gray>Verwaltet gesperrte Spieler-UUIDs mit optionalem Grund.</gray>"
      perf: "<gray>Zeigt leichte Laufzeit- und Cache-Statistiken ohne teure Scans.</gray>"
      reload: "<gray>Lädt Konfigurationen, Nachrichten und Runtime-Caches neu.</gray>"
  packetinfo:
    header: "<gray>Packet-Informationen für <white>%player%</white></gray>"
    uuid: "<gray>UUID: <white>%uuid%</white></gray>"
    mode: "<gray>Protection Mode: <white>%value%</white></gray>"
    rate: "<gray>Aktuelle Packet-Rate: <white>%value%/s</white></gray>"
    burst: "<gray>Burst Status: <white>%value%</white></gray>"
    violations: "<gray>Violations: <white>%value%</white></gray>"
    bypass: "<gray>Packet Bypass: <white>%value%</white></gray>"
    last-violation: "<gray>Letzter Verstoß: <white>%value%</white></gray>"
    no-live: "<gray>Für <white>%player%</white> liegen aktuell keine Live-Packetdaten vor.</gray>"
  status:
    player: "<gray>Spieler: <white>%player%</white></gray>"
    uuid: "<gray>UUID: <white>%uuid%</white></gray>"
    normalized-ip: "<gray>Normalisierte IP: <white>%ip%</white></gray>"
    protection-enabled: "<gray>IP-Schutz aktiv: <white>%value%</white></gray>"
    default-limit: "<gray>Konfiguriertes Standardlimit: <white>%value%</white></gray>"
    effective-limit: "<gray>Effektives Limit: <white>%value%</white></gray>"
    active: "<gray>Aktive Accounts auf dieser IP: <white>%value%</white></gray>"
    reserved: "<gray>Reservierte Login-Slots: <white>%value%</white></gray>"
    whitelisted: "<gray>UUID-Whitelist: <white>%value%</white></gray>"
    permission-bypass: "<gray>Permission-Bypass: <white>%value%</white></gray>"
    override: "<gray>IP-Override: <white>%value%</white></gray>"
    packet-rate: "<gray>Packet-Rate: <white>%rate%/s</white>, Tokens: <white>%tokens%</white></gray>"
    violations: "<gray>Violations: <white>%value%</white></gray>"
    uuid-blacklist: "<gray>UUID-Blacklist: <white>%value%</white></gray>"
    ip-blacklist: "<gray>IP-Blacklist: <white>%value%</white></gray>"
    packet-bypass: "<gray>Packet-Bypass: <white>%value%</white></gray>"
    packet-mode: "<gray>Packet-Modus: <white>%value%</white></gray>"
  list:
    count: "<gray>%list%: <white>%count%</white> Einträge.</gray>"
    entry: "<dark_gray>-</dark_gray> <white>%entry%</white>"
    check: "<gray>%entry% gelistet: <white>%value%</white></gray>"
  iplimit:
    check: "<gray>%ip% Override: <white>%value%</white></gray>"
  perf:
    active-sessions: "<gray>Active sessions: <white>%value%</white></gray>"
    active-groups: "<gray>Active IP groups: <white>%value%</white></gray>"
    reservations: "<gray>Reservations: <white>%value%</white></gray>"
    rate-states: "<gray>Rate limiter states: <white>%value%</white></gray>"
    storage-queue: "<gray>Storage queue: <white>%value%</white></gray>"
    history-entries: "<gray>History cache entries: <white>%value%</white></gray>"
    known-players: "<gray>Known players: <white>%value%</white></gray>"
    debug: "<gray>Debug logging: <white>%value%</white></gray>"

