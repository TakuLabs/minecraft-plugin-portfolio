    separator: "<dark_gray><strikethrough>----------------------------------------</strikethrough></dark_gray>"
    entry: "<light_purple>%syntax%</light_purple>"
    permission: "<gray>Permission: <white>%permission%</white></gray>"
    unknown: "<red>Dieser Befehl existiert nicht oder ist für dich nicht verfügbar.</red>"
    empty: "<gray>Für dich sind aktuell keine NovaGuard-Befehle verfügbar.</gray>"
    categories:
      general: "<dark_purple><bold>Allgemein</bold></dark_purple>"
      player-info: "<dark_purple><bold>Spielerinformationen</bold></dark_purple>"
      ip-protection: "<dark_purple><bold>IP-Schutz</bold></dark_purple>"
      player-management: "<dark_purple><bold>Spielerverwaltung</bold></dark_purple>"
